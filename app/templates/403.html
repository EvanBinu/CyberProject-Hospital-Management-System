{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 60vh;">

    <div class="col-lg-6 text-center">

        <div class="card shadow-glass border-0">

            <div class="card-body py-5">

                <div style="font-size: 4rem; color: var(--danger); margin-bottom: 1rem;">
                    <i class="fas fa-lock"></i>
                </div>

                <h2 class="fw-bold mb-3">
                    <span style="background: linear-gradient(135deg, #f5365c 0%, #f5576c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                        403 - Unauthorized
                    </span>
                </h2>

                <p class="text-muted fs-5 mb-4">
                    You do not have permission to access this page.
                </p>

                <p class="text-muted small mb-4">
                    <i class="fas fa-info-circle me-2"></i>
                    If you believe this is an error, please contact the administrator.
                </p>

                <a href="/dashboard" class="btn btn-primary">
                    <i class="fas fa-arrow-left me-2"></i>
                    Back to Dashboard
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
