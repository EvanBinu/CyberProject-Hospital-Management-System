{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 60vh;">

    <div class="col-lg-5 col-md-7">

        <div class="card shadow-glass border-0">

            <div class="card-header text-center py-4">

                <h3 class="m-0 text-white">
                    <i class="fas fa-user-plus me-2"></i>
                    Create Account
                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label fw-600">Username</label>

                        <div class="input-group">

                            <span class="input-group-text bg-transparent border-end-0">
                                <i class="fas fa-user text-primary"></i>
                            </span>

                            <input
                                type="text"
                                name="username"
                                class="form-control border-start-0 bg-transparent"
                                placeholder="Enter username"
                                required
                            >

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-600">Email Address</label>

                        <div class="input-group">

                            <span class="input-group-text bg-transparent border-end-0">
                                <i class="fas fa-envelope text-primary"></i>
                            </span>

                            <input
                                type="email"
                                name="email"
                                class="form-control border-start-0 bg-transparent"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-600">Password</label>

                        <div class="input-group">

                            <span class="input-group-text bg-transparent border-end-0">
                                <i class="fas fa-key text-primary"></i>
                            </span>

                            <input
                                type="password"
                                name="password"
                                class="form-control border-start-0 bg-transparent"
                                placeholder="Enter your password"
                                required
                            >

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-600">Select Role</label>

                        <select name="role" class="form-select" required>

                            <option value="">Select your role</option>

                            <option value="admin">
                                <i class="fas fa-crown me-2"></i> Admin
                            </option>

                            <option value="doctor">
                                <i class="fas fa-stethoscope me-2"></i> Doctor
                            </option>

                            <option value="receptionist">
                                <i class="fas fa-headset me-2"></i> Receptionist
                            </option>

                        </select>

                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-600">

                        <i class="fas fa-user-check me-2"></i>
                        Register Now

                    </button>

                </form>

                <div class="text-center mt-4">

                    <p class="text-muted">
                        Already have an account?
                        <a href="/login" class="text-decoration-none" style="color: var(--primary); font-weight: 600;">
                            Login here
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
