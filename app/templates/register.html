{% extends 'base.html' %}

{% block content %}

<h2>Register</h2>

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >
    <select name="role" required>

    <option value="">
        Select Role
    </option>

    <option value="admin">
        Admin
    </option>

    <option value="doctor">
        Doctor
    </option>

    <option value="receptionist">
        Receptionist
    </option>

</select>
    <button type="submit">
        Register
    </button>

</form>

{% endblock %}
