{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    Audit Logs
</h2>

<table class="table table-bordered shadow">

    <thead class="table-dark">

        <tr>

            <th>User</th>

            <th>Action</th>

            <th>Timestamp</th>

        </tr>

    </thead>

    <tbody>

        {% for log in logs %}

        <tr>

            <td>{{ log.username }}</td>

            <td>{{ log.action }}</td>

            <td>{{ log.timestamp }}</td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
