{% extends 'base.html' %}

{% block content %}

<div class="animated">

    <h2 class="mb-4">
        <i class="fas fa-calendar-edit me-2"></i>
        Edit Appointment
    </h2>

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-glass border-0">

                <div class="card-header">

                    <h5 class="m-0 text-white">
                        <i class="fas fa-calendar-check me-2"></i>
                        Update Appointment Details
                    </h5>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label fw-600">Patient Name</label>

                            <div class="input-group">

                                <span class="input-group-text bg-transparent border-end-0">
                                    <i class="fas fa-user text-primary"></i>
                                </span>

                                <input
                                    type="text"
                                    name="patient_name"
                                    class="form-control border-start-0 bg-transparent"
                                    value="{{ appointment.patient_name }}"
                                    required
                                >

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-600">Doctor Name</label>

                            <div class="input-group">

                                <span class="input-group-text bg-transparent border-end-0">
                                    <i class="fas fa-user-md text-primary"></i>
                                </span>

                                <input
                                    type="text"
                                    name="doctor_name"
                                    class="form-control border-start-0 bg-transparent"
                                    value="{{ appointment.doctor_name }}"
                                    required
                                >

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-600">Appointment Date</label>

                            <div class="input-group">

                                <span class="input-group-text bg-transparent border-end-0">
                                    <i class="fas fa-calendar text-primary"></i>
                                </span>

                                <input
                                    type="date"
                                    name="appointment_date"
                                    class="form-control border-start-0 bg-transparent"
                                    value="{{ appointment.appointment_date }}"
                                    required
                                >

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-600">Status</label>

                            <select
                                name="status"
                                class="form-select">

                                <option value="Pending" {% if appointment.status == 'Pending' %}selected{% endif %}>
                                    Pending
                                </option>

                                <option value="Completed" {% if appointment.status == 'Completed' %}selected{% endif %}>
                                    Completed
                                </option>

                                <option value="Cancelled" {% if appointment.status == 'Cancelled' %}selected{% endif %}>
                                    Cancelled
                                </option>

                            </select>

                        </div>

                        <div class="d-flex gap-2">

                            <button type="submit" class="btn btn-success flex-grow-1">
                                <i class="fas fa-save me-2"></i>
                                Update Appointment
                            </button>

                            <a href="/appointments" class="btn btn-outline-primary">
                                <i class="fas fa-times me-2"></i>
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
