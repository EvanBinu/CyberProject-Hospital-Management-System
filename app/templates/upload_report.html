{% extends 'base.html' %}

{% block content %}

<div class="animated">

    <h2 class="mb-4">
        <i class="fas fa-file-upload me-2"></i>
        Upload Medical Report
    </h2>

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-glass border-0">

                <div class="card-header">

                    <h5 class="m-0 text-white">
                        <i class="fas fa-file-medical me-2"></i>
                        Upload Appointment Report
                    </h5>

                </div>

                <div class="card-body">

                    <form method="POST" enctype="multipart/form-data">

                        <div class="mb-4">

                            <label class="form-label fw-600">
                                <i class="fas fa-file me-2"></i>
                                Select Report File
                            </label>

                            <div class="position-relative">

                                <input
                                    type="file"
                                    name="report"
                                    class="form-control"
                                    id="reportFile"
                                    accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
                                    required
                                    onchange="document.getElementById('fileName').textContent = this.files[0]?.name || 'No file selected'"
                                >

                            </div>

                            <small class="text-muted mt-2 d-block">
                                <i class="fas fa-info-circle me-1"></i>
                                Accepted formats: PDF, DOC, DOCX, JPG, PNG (Max 5MB)
                            </small>

                            <div class="mt-3 p-3 bg-light rounded-20" style="border: 2px dashed var(--primary); border-radius: 12px;">

                                <i class="fas fa-file" style="color: var(--primary); font-size: 2rem;"></i>

                                <p class="mt-2 mb-0 text-muted">
                                    <strong id="fileName">No file selected</strong>
                                </p>

                            </div>

                        </div>

                        <div class="d-flex gap-2">

                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="fas fa-cloud-upload-alt me-2"></i>
                                Upload Report
                            </button>

                            <a href="/appointments" class="btn btn-outline-primary">
                                <i class="fas fa-times me-2"></i>
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
