{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    Upload Medical Report
</h2>

<div class="card p-4 shadow">

    <form method="POST"
          enctype="multipart/form-data">

        <div class="mb-3">

            <label class="form-label">

                Select Report

            </label>

            <input
                type="file"
                name="report"
                class="form-control"
                required
            >

        </div>

        <button class="btn btn-primary">

            Upload Report

        </button>

    </form>

</div>

{% endblock %}
