{% extends 'base.html' %}

{% block content %}

<div class="animated">

    <h2 class="mb-4">
        <i class="fas fa-list me-2"></i>
        Audit Logs
    </h2>

    <div class="card shadow-glass border-0">

        <div class="card-header">

            <h5 class="m-0 text-white">
                <i class="fas fa-history me-2"></i>
                System Activity History
            </h5>

        </div>

        <div class="table-responsive">

            <table class="table mb-0">

                <thead class="table-dark">

                    <tr>

                        <th><i class="fas fa-user me-2"></i>User</th>

                        <th><i class="fas fa-tasks me-2"></i>Action</th>

                        <th><i class="fas fa-clock me-2"></i>Timestamp</th>

                    </tr>

                </thead>

                <tbody>

                    {% if logs %}

                        {% for log in logs %}

                        <tr>

                            <td>

                                <i class="fas fa-user-circle me-2" style="color: var(--primary);"></i>

                                <strong>{{ log.username }}</strong>

                            </td>

                            <td>

                                <span class="badge badge-primary">

                                    {{ log.action }}

                                </span>

                            </td>

                            <td>

                                <i class="fas fa-calendar-alt me-2" style="color: var(--muted);"></i>

                                {{ log.timestamp }}

                            </td>

                        </tr>

                        {% endfor %}

                    {% else %}

                        <tr>

                            <td colspan="3" class="text-center py-4">

                                <i class="fas fa-inbox" style="font-size: 3rem; color: var(--muted);"></i>

                                <p class="text-muted mt-2">No audit logs available</p>

                            </td>

                        </tr>

                    {% endif %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
